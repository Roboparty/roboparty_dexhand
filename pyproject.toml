[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "rphand"
version = "0.1.0"
description = "Python bindings for the rphand six-axis dexterous hand SDK"
readme = "docs/architecture.md"
requires-python = ">=3.9"
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[tool.scikit-build]
wheel.packages = ["python/rphand"]
install.components = ["python"]

[tool.scikit-build.cmake.define]
RPHAND_BUILD_PYTHON = "ON"
RPHAND_BUILD_DEMO = "OFF"
RPHAND_BUILD_SMOKE = "OFF"
BUILD_SHARED_LIBS = "OFF"
