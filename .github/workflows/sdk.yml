name: SDK
on: [push, pull_request]
jobs:
  hardware-free:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python-version: ['3.9', '3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Version consistency check
        run: python scripts/check_versions.py
      - name: Configure C++
        run: cmake -S . -B build/check -DRPHAND_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build C++
        run: cmake --build build/check --config Release --parallel 2
      - name: Test C++ without hardware
        run: ctest --test-dir build/check -C Release --output-on-failure --parallel 2
      - name: Install C++
        run: cmake --install build/check --config Release --prefix "${{ github.workspace }}/install/check"
      - name: Configure installed C++ consumer
        run: cmake -S tests -B build/consumer -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install/check"
      - name: Build installed C++ consumer
        run: cmake --build build/consumer --config Release --parallel 2
      - name: Run installed C++ consumer
        run: ctest --test-dir build/consumer -C Release --output-on-failure
      - name: Install Python build dependencies
        run: python -m pip install "scikit-build-core>=0.10" "pybind11>=2.13"
      - name: Build and check source archive
        run: python tests/test_python.py --sdist dist
      - name: Install Python from source archive
        run: python -m pip install --no-build-isolation --no-index --no-binary=rphand --find-links=dist rphand
      - name: Test Python without hardware
        run: python -m unittest discover -s tests -p test_python.py -v

  ros2-jazzy:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install ROS build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-rosdep

      - name: Install ROS dependencies
        run: |
          rosdep update
          rosdep install --from-paths ros2 --ignore-src -y

      - name: Build ROS 2 package
        run: |
          . /opt/ros/jazzy/setup.bash
          colcon build --base-paths ros2 \
            --build-base build/ros --install-base install/ros \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: ROS 2 lifecycle test
        run: |
          . /opt/ros/jazzy/setup.bash
          . install/ros/setup.bash
          ROS_DOMAIN_ID=187 ROS_LOCALHOST_ONLY=1 \
            python3 tests/ros_lifecycle.py \
            "$(ros2 pkg prefix rphand_ros)/lib/rphand_ros/rphand_node"
